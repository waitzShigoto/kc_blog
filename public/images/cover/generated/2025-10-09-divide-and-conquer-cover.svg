<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grad)" />
  
    <circle cx="10%" cy="10%" r="150" fill="white" fill-opacity="0.1" />
    <circle cx="90%" cy="90%" r="200" fill="white" fill-opacity="0.1" />
    <circle cx="80%" cy="10%" r="80" fill="white" fill-opacity="0.05" />
  
  
  <!-- Category Badge -->
  <g transform="translate(600, 100)" text-anchor="middle">
    <rect x="-184" y="-40" width="368" height="80" rx="40" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <text y="15" font-family="Arial, sans-serif" font-size="36" fill="white" font-weight="bold" style="text-shadow: 0 2px 4px rgba(0,0,0,0.2);">⚙️ FUNDAMENTALS</text>
  </g>
  
  <!-- Title -->
  <text x="50%" y="335" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="56" fill="white" style="text-shadow: 0 4px 12px rgba(0,0,0,0.3);">演算法日記 - Divide and Conquer</text>
  
  <!-- Brand Footer -->
  <g transform="translate(1150, 590)" text-anchor="end">
    <text font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.9)" font-weight="bold">Elegant Access</text>
  </g>
</svg>